<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d24" />
    <title>Traffic Lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1b1d24; overflow: hidden; touch-action: none; }
      canvas#gl { display: block; width: 100vw; height: 100vh; height: 100dvh; }
      #hud { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 8px; color: #f3efe6;
             background: rgba(20, 22, 28, .6); padding: 4px 8px; border-radius: 6px;
             font: 12px/1.3 ui-monospace, Menlo, monospace; pointer-events: none; white-space: pre-wrap;
             max-width: calc(100vw - 130px); box-sizing: border-box; }

      /* Editor UI: cosy pastel cards over the scene, sized for thumbs. */
      :root { --card: rgba(30, 32, 40, .86); --ink: #f3efe6; --dim: #a9a49a; --accent: #8fd3b6;
              --warn: #ff8a7a; --chip: rgba(255, 255, 255, .08); --chip-on: #f3efe6; --chip-on-ink: #1b1d24; }
      #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 8px calc(env(safe-area-inset-bottom) + 8px);
            display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
            font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
      #ui > * { pointer-events: auto; }
      .card { background: var(--card); border-radius: 14px; padding: 8px 10px; box-shadow: 0 4px 18px rgba(0,0,0,.25);
              max-width: min(560px, 100%); box-sizing: border-box; }
      #toolbar { display: flex; gap: 2px; padding: 4px; }
      #toolbar button, .chip { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit;
              border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #toolbar button { width: 50px; height: 52px; display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 2px; font-size: 10px; }
      #toolbar button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2;
              stroke-linecap: round; stroke-linejoin: round; }
      #toolbar button.on { background: var(--chip-on); color: var(--chip-on-ink); }
      #toolbar button:disabled { opacity: .35; }
      #toolbar .sep { width: 1px; background: rgba(255,255,255,.15); margin: 8px 3px; }
      #info { text-align: center; color: var(--dim); font-size: 13px; }
      #info .err { color: var(--warn); }
      #info b { color: var(--ink); font-weight: 600; }
      #panel { width: min(560px, 100%); max-height: 36vh; overflow-y: auto; padding: 6px 10px; }
      #panel h3 { margin: 2px 0 6px; font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase;
              letter-spacing: .05em; }
      .row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin: 4px 0; }
      .row .label { min-width: 74px; color: var(--dim); }
      .chip { background: var(--chip); padding: 6px 10px; min-height: 34px; }
      .chip.on { background: var(--chip-on); color: var(--chip-on-ink); }
      .chip.lane { min-width: 48px; font-size: 15px; line-height: 1.1; }
      .chip.lane .auto { color: var(--dim); font-size: 11px; display: block; }
      .chip.lane.on .auto { color: #555; }
      .num { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
      .sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; }
      #reset { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 8px; appearance: none; border: 0;
               background: var(--card); color: var(--ink); font: 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
               padding: 8px 12px; border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <button id="reset" title="Start the city over">↺ Reset</button>
    <div id="ui">
      <div id="panel" class="card" hidden></div>
      <div id="info" class="card" hidden></div>
      <div id="toolbar" class="card"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
