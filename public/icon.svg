<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Traffic Lab app icon: a crossroads seen from above, in the game's pastel palette.
       Full-bleed square (phones round the corners themselves); the junction and cars sit
       inside the central 80 % circle so Android's masks never cut them. -->
  <rect width="512" height="512" fill="#99c480"/>
  <!-- blocks: houses and trees -->
  <rect x="40" y="44" width="104" height="96" rx="6" fill="#f5e8d1"/>
  <path d="M34 44 L92 8 L150 44 Z" fill="#cc7a63"/>
  <rect x="368" y="388" width="104" height="84" rx="6" fill="#c4d6eb"/>
  <path d="M362 388 L420 354 L478 388 Z" fill="#78859a"/>
  <circle cx="420" cy="92" r="46" fill="#78a96b"/>
  <circle cx="400" cy="74" r="20" fill="#8cb873"/>
  <circle cx="92" cy="420" r="46" fill="#639465"/>
  <circle cx="72" cy="402" r="20" fill="#78a96b"/>
  <!-- kerbs -->
  <rect x="0" y="171" width="512" height="170" fill="#e4ded2"/>
  <rect x="171" y="0" width="170" height="512" fill="#e4ded2"/>
  <!-- asphalt -->
  <rect x="0" y="181" width="512" height="150" fill="#4a4d57"/>
  <rect x="181" y="0" width="150" height="512" fill="#4a4d57"/>
  <!-- centre lines, stopping short of the junction -->
  <g fill="#f3efe6">
    <rect x="0" y="251" width="34" height="10" rx="3"/>
    <rect x="62" y="251" width="34" height="10" rx="3"/>
    <rect x="124" y="251" width="34" height="10" rx="3"/>
    <rect x="354" y="251" width="34" height="10" rx="3"/>
    <rect x="416" y="251" width="34" height="10" rx="3"/>
    <rect x="478" y="251" width="34" height="10" rx="3"/>
    <rect x="251" y="0" width="10" height="34" rx="3"/>
    <rect x="251" y="62" width="10" height="34" rx="3"/>
    <rect x="251" y="124" width="10" height="34" rx="3"/>
    <rect x="251" y="354" width="10" height="34" rx="3"/>
    <rect x="251" y="416" width="10" height="34" rx="3"/>
    <rect x="251" y="478" width="10" height="34" rx="3"/>
  </g>
  <!-- red car heading east in the near lane -->
  <g transform="translate(122 293)">
    <rect x="-48" y="-24" width="96" height="48" rx="14" fill="#db615a"/>
    <rect x="8" y="-19" width="20" height="38" rx="5" fill="#2c2f38"/>
    <rect x="-34" y="-17" width="14" height="34" rx="4" fill="#2c2f38"/>
  </g>
  <!-- yellow car heading north, entering the junction -->
  <g transform="translate(293 380)">
    <rect x="-24" y="-48" width="48" height="96" rx="14" fill="#f5c75c"/>
    <rect x="-19" y="-28" width="38" height="20" rx="5" fill="#2c2f38"/>
    <rect x="-17" y="20" width="34" height="14" rx="4" fill="#2c2f38"/>
  </g>
  <!-- teal car heading south, waiting its turn -->
  <g transform="translate(219 118)">
    <rect x="-24" y="-48" width="48" height="96" rx="14" fill="#5ea89e"/>
    <rect x="-19" y="8" width="38" height="20" rx="5" fill="#2c2f38"/>
    <rect x="-17" y="-34" width="34" height="14" rx="4" fill="#2c2f38"/>
  </g>
</svg>
